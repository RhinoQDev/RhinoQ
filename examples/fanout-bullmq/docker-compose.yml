services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: rhinoq
      POSTGRES_DB: fanout
    ports: ['55433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
