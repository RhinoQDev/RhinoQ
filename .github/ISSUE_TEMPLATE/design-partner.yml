name: Design partner inquiry
description: Volunteer a real workload for a short, controlled RhinoQ pilot.
title: "[design partner] "
labels:
  - design-partner
body:
  - type: markdown
    attributes:
      value: |
        A pilot uses synthetic or redacted data, lasts up to 30 days and requires no production credentials. Please do not post private incident details here.
  - type: input
    id: contact
    attributes:
      label: Preferred contact
      description: Share an email or public profile only if you are comfortable doing so.
    validations:
      required: true
  - type: dropdown
    id: workload
    attributes:
      label: Workload type
      options:
        - Node / BullMQ batch
        - Payments / billing provider
        - Provisioning / fulfilment
        - Other background job
    validations:
      required: true
  - type: textarea
    id: mismatch
    attributes:
      label: Mismatch to investigate
      description: Describe the green execution whose provider or business outcome can still be wrong.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Pilot success signal
      description: What evidence would make the integration useful after 30 days?
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I understand this issue is public and will not contain secrets or customer data.
          required: true
