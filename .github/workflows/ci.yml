name: CI
run-name: CI @ ${{ github.sha }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Re-run time-sensitive storage contracts even when the repository is idle.
    - cron: "23 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show tested revision
        run: git show --no-patch --format='Testing commit %H'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: gofmt -d cmd internal tests pkg examples
      # ./... stops at the main module even under a workspace, so the nested
      # PostgreSQL harness is named explicitly. It skips without a database and
      # says so; the postgres job below runs it against a real one.
      - run: go vet ./... ./tests/postgres/...
      - run: go test -race -count=1 -shuffle=on ./... ./tests/postgres/...
      - name: Validate release archive configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
        env:
          GOWORK: "off"

  postgres:
    name: PostgreSQL integration harness
    runs-on: ubuntu-latest
    # The engine enforces fencing, admission and recovery in SQL. Reviewing that
    # SQL is not evidence that it works, so it runs against a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhinoq
          POSTGRES_PASSWORD: rhinoq
          POSTGRES_DB: rhinoq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhinoq -d rhinoq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Show tested revision
        run: git show --no-patch --format='Testing commit %H'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
        working-directory: tests/postgres
      - name: PostgreSQL contracts (fresh and shuffled)
        run: go test ./... -count=1 -shuffle=on
        working-directory: tests/postgres
        env:
          RHINOQ_TEST_DATABASE_URL: "postgres://rhinoq:rhinoq@localhost:5432/rhinoq?sslmode=disable&options=-c%20rhinoq.tenant_id%3Dtnt_system"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: sdks/node
      - run: npm run build
        working-directory: sdks/node
      - name: Node PostgreSQL integration
        run: node --test test/postgres.integration.test.mjs
        working-directory: sdks/node
        env:
          RHINOQ_TEST_DATABASE_URL: "postgres://rhinoq:rhinoq@localhost:5432/rhinoq?sslmode=disable&options=-c%20rhinoq.tenant_id%3Dtnt_system"
      - name: PostgreSQL concurrency and fan-out smoke
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node bench/postgres-benchmark.mjs
        working-directory: sdks/node
        env:
          RHINOQ_TEST_DATABASE_URL: "postgres://rhinoq:rhinoq@localhost:5432/rhinoq?sslmode=disable&options=-c%20rhinoq.tenant_id%3Dtnt_system"
          RHINOQ_BENCH_ITERATIONS: 200
          RHINOQ_BENCH_CONCURRENCIES: 1,8,16,32
          RHINOQ_BENCH_FANOUT_SIZES: 10,100,500
          RHINOQ_BENCH_FANOUT_CONCURRENCIES: 1,8,32
          RHINOQ_BENCH_FANOUT_READS: 50

  node-sdk:
    name: Node SDK checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Show tested revision
        run: git show --no-patch --format='Testing commit %H'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: sdks/node
      - run: npm test
        working-directory: sdks/node
      - run: npm run pack:check
        working-directory: sdks/node
      - run: npm test
        working-directory: sdks/nest

  fanout-smoke:
    name: Fan-out settles (gating)
    runs-on: ubuntu-latest
    # The example hung on roughly two runs in three and every manual review
    # passed, including the author's, because a green run proves nothing about
    # a race. This job is the reason that cannot happen again: real Postgres,
    # real Redis, real BullMQ, real batches, and a non-zero exit unless every
    # item reaches a terminal state and the settled signal fires exactly once.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhinoq
          POSTGRES_PASSWORD: rhinoq
          POSTGRES_DB: fanout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhinoq -d fanout"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      RHINOQ_DATABASE_URL: postgres://rhinoq:rhinoq@127.0.0.1:5432/fanout
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: sdks/node
      - run: npm run build
        working-directory: sdks/node
      - name: Node PostgreSQL Task contracts
        run: node --test test/task-conflicts.integration.test.mjs
        working-directory: sdks/node
        env:
          RHINOQ_TEST_DATABASE_URL: postgres://rhinoq:rhinoq@127.0.0.1:5432/fanout
      - run: npm install
        working-directory: examples/fanout-bullmq
      - run: npx rhinoq-task
        working-directory: examples/fanout-bullmq
      # Ten batches, not one. A defect that shows up two runs in three survives
      # any single run; ten make a silent regression a certainty to catch.
      - name: Fan-out batches settle
        run: npm run smoke
        working-directory: examples/fanout-bullmq
        env:
          RHINOQ_SMOKE_SIZES: 50,50,50,100,100,200,200
          RHINOQ_SMOKE_SLOW_SIZES: 50,50,100

  benchmark-smoke:
    name: Benchmark smoke (non-gating evidence)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: sdks/node
      - run: npm run build
        working-directory: sdks/node
      - name: Node SDK microbenchmark JSON
        run: node bench/task-benchmark.mjs
        working-directory: sdks/node
        env:
          RHINOQ_BENCH_ITERATIONS: 20000
          RHINOQ_BENCH_SAMPLES: 5
      - name: Go domain/memory benchmark
        run: go test ./tests/benchmarks -run '^$' -bench . -benchmem -count=3
