name: CI
run-name: CI @ ${{ github.sha }}

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show tested revision
        run: git show --no-patch --format='Testing commit %H'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -d cmd internal tests pkg examples
      - run: go vet ./...
      - run: go test -race ./...

  postgres:
    name: PostgreSQL integration harness
    runs-on: ubuntu-latest
    # The engine enforces fencing, admission and recovery in SQL. Reviewing that
    # SQL is not evidence that it works, so it runs against a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhinoq
          POSTGRES_PASSWORD: rhinoq
          POSTGRES_DB: rhinoq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhinoq -d rhinoq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Show tested revision
        run: git show --no-patch --format='Testing commit %H'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
        working-directory: tests/postgres
      - run: go test ./... -count=1
        working-directory: tests/postgres
        env:
          RHINOQ_TEST_DATABASE_URL: postgres://rhinoq:rhinoq@localhost:5432/rhinoq?sslmode=disable

  typescript-sdk:
    name: TypeScript SDK checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show tested revision
        run: git show --no-patch --format='Testing commit %H'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: sdks/typescript
      - run: npm run typecheck
        working-directory: sdks/typescript
