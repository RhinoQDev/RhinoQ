name: Release

# Runs only for an explicit tag push. Nothing is published on a normal commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  node-sdk:
    name: Publish Node SDK to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: sdks/node
      - run: npm test
        working-directory: sdks/node
      - run: npm run pack:check
        working-directory: sdks/node
      - run: npm run release:check -- "${GITHUB_REF_NAME}"
        working-directory: sdks/node
      # Configure npm trusted publishing for @rhinoq/node before the first tag.
      # This uses GitHub OIDC instead of storing an npm token in repository secrets.
      - run: npm publish --provenance --access public --tag next
        working-directory: sdks/node

  goreleaser:
    name: Build and publish CLI binaries
    runs-on: ubuntu-latest
    needs: node-sdk
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
