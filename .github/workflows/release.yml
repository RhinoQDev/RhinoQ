name: Release

# Runs only for an explicit tag push. Nothing is published on a normal commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  node-verify:
    name: Verify Node SDK release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the same npm CLI as publishing
        run: npm install --global npm@12
      - run: npm ci
        working-directory: sdks/node
      - run: npm test
        working-directory: sdks/node
      - run: npm run pack:check
        working-directory: sdks/node
      - run: npm run release:check -- "${GITHUB_REF_NAME}"
        working-directory: sdks/node
      - name: Verify one version across every published package
        run: node .github/scripts/verify-release-matrix.mjs "${GITHUB_REF_NAME}"
      - name: Verify npm authentication contract
        run: node .github/scripts/verify-release-workflow.mjs
      - name: Validate unscoped npm alias
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
          npm pack --dry-run --ignore-scripts
        working-directory: sdks/rhinoq
      - name: Verify create-rhinoq-app
        run: npm test
        working-directory: sdks/create-rhinoq-app
      - name: Validate create-rhinoq-app archive
        run: npm pack --dry-run --ignore-scripts
        working-directory: sdks/create-rhinoq-app

  node-publish:
    name: Publish Node SDK to npm
    runs-on: ubuntu-latest
    needs: node-verify
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@12
      - run: npm ci
        working-directory: sdks/node
      - name: Publish scoped SDK with the semver-appropriate dist-tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          # npm Trusted Publishing authenticates this publish with the job's
          # GitHub OIDC identity. Do not fall back to a token: a token without
          # the npm 2FA-bypass capability stops the runner at an OTP prompt.
          npm publish --access public --tag "$tag"
        working-directory: sdks/node

  node-publish-alias:
    name: Publish unscoped Node SDK alias
    runs-on: ubuntu-latest
    needs: node-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@12
      - name: Publish rhinoq alias
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          # npm Trusted Publishing authenticates this publish with the job's
          # GitHub OIDC identity. Do not fall back to a token: a token without
          # the npm 2FA-bypass capability stops the runner at an OTP prompt.
          npm publish --access public --tag "$tag"
        working-directory: sdks/rhinoq

  create-app-publish:
    name: Publish create-rhinoq-app
    runs-on: ubuntu-latest
    needs: node-publish-alias
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@12
      - name: Publish scaffolder after its SDK dependency
        shell: bash
        env:
          # Used only if the package does not exist yet; then configure its
          # trusted publisher and delete this secret immediately afterwards.
          NPM_CREATE_APP_BOOTSTRAP_TOKEN: ${{ secrets.NPM_CREATE_APP_BOOTSTRAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          if npm view create-rhinoq-app name >/dev/null 2>&1; then
            # The package already exists, so use OIDC and never trigger an
            # interactive OTP challenge from a stale bootstrap token.
            npm publish --access public --tag "$tag"
          elif [[ -n "${NPM_CREATE_APP_BOOTSTRAP_TOKEN:-}" ]]; then
            # This token must be a granular write token with 2FA bypass
            # enabled; otherwise npm returns EOTP in a non-interactive runner.
            NODE_AUTH_TOKEN="$NPM_CREATE_APP_BOOTSTRAP_TOKEN" \
              npm publish --provenance --access public --tag "$tag"
          else
            echo "create-rhinoq-app is not on npm; set NPM_CREATE_APP_BOOTSTRAP_TOKEN or configure the package first"
            exit 1
          fi
        working-directory: sdks/create-rhinoq-app

  registry-smoke:
    name: Verify packages from npm registry
    runs-on: ubuntu-latest
    needs: create-app-publish
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Wait for all registry replicas
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in @rhinoq/node rhinoq create-rhinoq-app; do
            found=""
            for attempt in {1..12}; do
              found="$(npm view "$package@$version" version 2>/dev/null || true)"
              [[ "$found" == "$version" ]] && break
              sleep 10
            done
            [[ "$found" == "$version" ]] || { echo "$package@$version did not reach the registry"; exit 1; }
            attestations="$(npm view "$package@$version" dist.attestations --json 2>/dev/null || true)"
            [[ -n "$attestations" && "$attestations" != "null" ]] || {
              echo "$package@$version has no registry provenance attestation"
              exit 1
            }
          done
      - name: Clean ESM, CommonJS, CLI and scaffold smoke
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="$(mktemp -d)"
          cd "$root"
          npm init -y >/dev/null
          npm install --save-exact "@rhinoq/node@$version" "rhinoq@$version" "create-rhinoq-app@$version" pg
          node --input-type=module -e "import('@rhinoq/node').then(m => { if (!m.ApplicationTaskClient) process.exit(1) })"
          node -e "if (!require('@rhinoq/node').ApplicationTaskClient) process.exit(1)"
          test "$(./node_modules/.bin/rhinoq --version)" = "$version"
          ./node_modules/.bin/rhinoq-task-check --help >/dev/null
          ./node_modules/.bin/create-rhinoq-app app --no-install
          test "$(node -p "require('./app/package.json').dependencies['@rhinoq/node']")" = "$version"
          npm audit signatures

  node-release-asset:
    name: Attach installable Node SDK archive
    runs-on: ubuntu-latest
    # GoReleaser owns creation of the GitHub Release. Sequencing avoids two
    # jobs racing to create the same tag release.
    needs: goreleaser
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use the same npm CLI as publishing
        run: npm install --global npm@12
      - run: npm ci
        working-directory: sdks/node
      - name: Pack and attach the exact Node release candidate
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null
          npm pack --pack-destination "${RUNNER_TEMP}"
          tarball="${RUNNER_TEMP}/rhinoq-node-${GITHUB_REF_NAME#v}.tgz"
          test -f "${tarball}"
          gh release upload "${GITHUB_REF_NAME}" "${tarball}" --clobber
        working-directory: sdks/node
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    name: Build and publish CLI binaries
    runs-on: ubuntu-latest
    needs: registry-smoke
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The workspace exists so the PostgreSQL harness compiles from the
          # root. A published binary must resolve from go.mod alone, or its
          # dependency set stops matching the one the SBOM describes.
          GOWORK: "off"
      - name: Verify the published keyless checksum bundle
        shell: bash
        run: >-
          cosign verify-blob dist/checksums.txt
          --bundle dist/checksums.txt.sigstore.json
          --certificate-identity
          "https://github.com/madebyduy/RhinoQ/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  container:
    name: Publish signed container image
    runs-on: ubuntu-latest
    needs: registry-smoke
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/madebyduy/rhinoq:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/madebyduy/rhinoq
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
