name: Release

# Runs only for an explicit tag push. Nothing is published on a normal commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  node-verify:
    name: Verify Node SDK release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use the same npm CLI as publishing
        run: npm install --global npm@12
      - run: npm ci
        working-directory: sdks/node
      - run: npm test
        working-directory: sdks/node
      - run: npm run pack:check
        working-directory: sdks/node
      - run: npm run release:check -- "${GITHUB_REF_NAME}"
        working-directory: sdks/node
      - name: Validate unscoped npm alias
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
          npm pack --dry-run --ignore-scripts
        working-directory: sdks/rhinoq

  node-publish:
    name: Publish Node SDK to npm
    runs-on: ubuntu-latest
    needs: node-verify
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@12
      - run: npm ci
        working-directory: sdks/node
      # Configure npm trusted publishing for @rhinoq/node before the first tag.
      # This uses GitHub OIDC instead of storing an npm token in repository secrets.
      - run: npm publish --provenance --access public --tag latest
        working-directory: sdks/node

  node-publish-alias:
    name: Publish unscoped Node SDK alias
    runs-on: ubuntu-latest
    needs: node-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global npm@12
      - name: Publish rhinoq alias
        run: npm publish --provenance --access public --tag latest
        working-directory: sdks/rhinoq

  node-release-asset:
    name: Attach installable Node SDK archive
    runs-on: ubuntu-latest
    needs: node-verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use the same npm CLI as publishing
        run: npm install --global npm@12
      - run: npm ci
        working-directory: sdks/node
      - name: Pack and attach the exact Node release candidate
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
          npm pack --pack-destination "${RUNNER_TEMP}"
          tarball="${RUNNER_TEMP}/rhinoq-node-${GITHUB_REF_NAME#v}.tgz"
          test -f "${tarball}"
          gh release upload "${GITHUB_REF_NAME}" "${tarball}" --clobber
        working-directory: sdks/node
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    name: Build and publish CLI binaries
    runs-on: ubuntu-latest
    needs: node-verify
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the published keyless checksum bundle
        shell: bash
        run: >-
          cosign verify-blob dist/checksums.txt
          --bundle dist/checksums.txt.sigstore.json
          --certificate-identity
          "https://github.com/madebyduy/RhinoQ/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  container:
    name: Publish signed container image
    runs-on: ubuntu-latest
    needs: node-verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/madebyduy/rhinoq:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/madebyduy/rhinoq
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
