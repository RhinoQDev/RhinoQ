name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm
          --mount type=bind,source="${{ github.workspace }}",target=/repo,readonly
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact
          --gitleaks-ignore-path /repo/.gitleaksignore
      - name: Scan checked-out files
        run: >-
          docker run --rm
          --mount type=bind,source="${{ github.workspace }}",target=/repo,readonly
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --no-banner --redact
          --gitleaks-ignore-path /repo/.gitleaksignore

  go-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/postgres/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
        working-directory: tests/postgres

  node-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/node/package-lock.json
      - run: npm audit
        working-directory: sdks/node

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect GitHub Dependency graph
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh api --include "/repos/${GH_REPOSITORY}/dependency-graph/sbom" 2>/dev/null | sed -n '1p' || true)"
          case "$status" in
            *" 200 "*) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            *" 404 "*) echo "enabled=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unexpected Dependency graph API response: ${status:-empty}" >&2
              exit 1
              ;;
          esac
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
      - name: Explain skipped dependency review
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: >-
          echo "::warning::GitHub Dependency graph is not enabled for this repository;
          dependency-review-action was skipped. npm audit, govulncheck, gitleaks
          and CodeQL remain required security checks. Enable Dependency graph in
          Settings > Security > Code security to activate PR dependency review."

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go, javascript-typescript
      - uses: github/codeql-action/analyze@v3
