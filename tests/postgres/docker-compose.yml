# A throwaway PostgreSQL for the integration harness.
#
#   docker compose -f tests/postgres/docker-compose.yml up -d
#   make test-postgres
#   docker compose -f tests/postgres/docker-compose.yml down -v
#
# Nothing here is a production reference. It runs on a non-default port so it
# cannot collide with a database you actually care about.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rhinoq
      POSTGRES_PASSWORD: rhinoq
      POSTGRES_DB: rhinoq
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhinoq -d rhinoq"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      # The data is disposable, so keep it off disk and out of the way.
      - /var/lib/postgresql/data
