name: __NAME__

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rhinoq
      POSTGRES_PASSWORD: rhinoq
      POSTGRES_DB: rhinoq
    ports: ['__PGPORT__:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rhinoq -d rhinoq']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['__REDISPORT__:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
